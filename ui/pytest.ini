[pytest]
pythonpath = .
testpaths = tests
norecursedirs = reports .venv .git
addopts = -ra --strict-markers
markers =
    smoke: home and console load
    sanity: source chips, Enter-clear, login chip
    regression: ingest recipe and Tools tab
    ui: Playwright against the local portfolio pages
filterwarnings =
    ignore::DeprecationWarning
