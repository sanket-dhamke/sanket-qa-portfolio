[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast health and happy-path checks
    sanity: schema, payload, and timing checks
    regression: broader API/UI/performance catalog
    ui: Playwright checks against the local portfolio pages
    live: optional calls to a public sandbox API (skipped unless --run-live)
filterwarnings =
    ignore::DeprecationWarning
