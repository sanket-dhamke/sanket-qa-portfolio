[pytest]
pythonpath = .
testpaths = tests
norecursedirs = ui .git
addopts = -ra --strict-markers
markers =
    smoke: fast health and happy-path API checks
    sanity: schema, payload, and timing API checks
    regression: broader API catalog
    live: optional calls to a public sandbox API (skipped unless --run-live)
    lab_issue: known DataHub lab fixture failure (mae-consumer OOM); Allure records it, CI excludes it
filterwarnings =
    ignore::DeprecationWarning
